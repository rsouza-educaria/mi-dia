<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi día: mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/alexia-ds.css">
<style>
  /* Solo lo que el kit no trae. Tokens con nombre real, sin hex sueltos. */
  .shell { flex: 1; display: flex; overflow: hidden; background: var(--color-grey-300); }
  .ref-main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 24px; text-align: center;
    color: var(--rf-color-text-sec); font-family: var(--font-family-reading); font-size: var(--font-size-200);
  }
  .ref-main strong { font-family: var(--font-family-ui); font-size: var(--font-size-300); color: var(--rf-color-text); }

  /* Barra de iconos: solo referencia visual del shell. El único item real es Mi día (el último). */
  .wp-btn.ref { background: var(--color-grey-300); cursor: default; }
  .wp-btn.ref svg { stroke: var(--color-grey-600); }
  .wp-btn.mi-dia { background: var(--color-blue-50); }
  .wp-btn.mi-dia svg { stroke: var(--color-blue-500); }
  .ph-icon.azul { background: var(--color-blue-50); }
  .ph-icon.azul svg { stroke: var(--color-blue-500); fill: none; stroke-width: 2; }
  .ph-bar.azul { background: var(--color-blue-500); }

  /* Cuerpo del panel */
  .bloque { border-bottom: 1px solid var(--rf-color-border-light); }
  .bloque:last-child { border-bottom: none; }
  .bloque .section-label { margin-bottom: 0; }
  .wc-avatar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  .list-row .row-check { flex-shrink: 0; }
  .todas { background: var(--rf-bg-normal); cursor: pointer; font-family: var(--font-family-ui); font-size: var(--font-size-200); font-weight: var(--font-weight-semibold); color: var(--rf-color-text); }
  .aviso {
    margin: 12px 16px; padding: 10px 12px; border-radius: var(--radius-md);
    background: var(--alert-bg-success); border: 1px solid var(--alert-border-success); color: var(--alert-text-success);
    font-family: var(--font-family-reading); font-size: var(--font-size-200); line-height: var(--line-height-200);
  }
  .vacio { padding: 32px 16px; text-align: center; color: var(--rf-color-text-sec); font-family: var(--font-family-reading); font-size: var(--font-size-200); }

  /* El kit pinta el texto de warning/error con tonos que no llegan a AA sobre su fondo: se usan los de alerta. */
  .wc-status[status="warning"] { color: var(--alert-text-warning); }
  .wc-status[status="error"]   { color: var(--alert-text-error); }

  /* Faja de versiones: mismo prototipo, varias versiones */
  .versiones {
    height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: var(--rf-bg-normal); border-bottom: 1px solid var(--rf-color-border-light);
    font-family: var(--font-family-ui); font-size: var(--font-size-100);
  }
  .versiones span { color: var(--rf-color-text-sec); margin-right: 8px; }
  .versiones a {
    padding: 4px 10px; border-radius: var(--radius-sm); text-decoration: none;
    color: var(--rf-color-text-sec); font-weight: var(--font-weight-bold);
  }
  .versiones a:hover { background: var(--color-grey-300); }
  .versiones a[aria-current="page"] { background: var(--color-blue-50); color: var(--color-blue-500); }
  .right-panel { top: 32px; }

  /* Foco visible */
  .versiones a:focus-visible,
  .alumn-row:focus-visible, .list-row:focus-visible, .wp-btn:focus-visible, .ph-btn:focus-visible,
  .com-toggle-btn:focus-visible, .btn-primary:focus-visible, .btn-secondary:focus-visible {
    outline: 2px solid var(--rf-color-primary); outline-offset: -2px;
  }
</style>
</head>
<body>

<nav class="versiones" aria-label="Versiones del mockup">
  <span>Mi día</span>
  <a href="v1.html" aria-current="page">V1</a>
  <a href="v2.html">V2</a>
</nav>

<div class="shell">

  <main class="ref-main">
    <strong>Contenido de la aplicación</strong>
    <span>Referencia visual del shell. El mockup es el panel Mi día, último icono de la barra de la derecha.</span>
  </main>

  <!-- Barra de iconos de la derecha -->
  <div class="webparts-bar">
    <button class="wp-btn ref" type="button" aria-label="Otros apartados (referencia)" data-tip="Otros apartados (referencia)" tabindex="-1">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="wp-btn ref" type="button" aria-label="Otros apartados (referencia)" data-tip="Otros apartados (referencia)" tabindex="-1">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="wp-btn ref" type="button" aria-label="Otros apartados (referencia)" data-tip="Otros apartados (referencia)" tabindex="-1">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <div class="wp-spacer"></div>
    <!-- El último: Mi día -->
    <button class="wp-btn mi-dia active" id="btn-mi-dia" type="button" aria-label="Mi día" data-tip="Mi día" aria-expanded="true">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px;">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
        <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
      </svg>
      <span class="wp-badge" id="badge-mi-dia">0</span>
    </button>
  </div>
</div>

<!-- Panel: right-sidebar -->
<aside class="right-panel open" id="right-panel" aria-label="Mi día">

  <!-- Cabecera nivel 1 -->
  <div class="panel-header" id="header-home">
    <div class="ph-icon azul">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
        <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
      </svg>
    </div>
    <div class="ph-bar azul"></div>
    <div class="ph-titles">
      <span class="ph-title">Mi día</span>
      <span class="ph-subtitle">Pendiente de hoy, martes 3 de noviembre</span>
    </div>
    <button class="com-toggle-btn" type="button" style="width:28px;height:28px;" data-expand title="Expandir panel" aria-label="Expandir panel"></button>
    <button class="ph-btn" type="button" id="cerrar-home" aria-label="Cerrar panel">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- Cabecera nivel 2 -->
  <div class="panel-header" id="header-detail" style="display:none;">
    <button class="ph-btn" type="button" id="volver" aria-label="Volver a Mi día">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="ph-bar azul"></div>
    <div class="ph-titles">
      <span class="ph-title" id="detail-title"></span>
      <span class="ph-subtitle" id="detail-subtitle"></span>
    </div>
    <button class="com-toggle-btn" type="button" style="width:28px;height:28px;" data-expand title="Expandir panel" aria-label="Expandir panel"></button>
    <button class="ph-btn" type="button" id="cerrar-detail" aria-label="Cerrar panel">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="panel-body">
    <div class="view active" id="view-home"></div>
    <div class="view" id="view-detail"></div>
  </div>

  <!-- Pie: solo en las listas con acción en masa. Acción principal a la izquierda. -->
  <footer class="panel-footer" id="footer" style="display:none;">
    <button class="btn-primary btn-sm" type="button" id="accion-masiva" disabled></button>
    <button class="btn-secondary btn-sm" type="button" id="cancelar">Cancelar</button>
  </footer>
</aside>

<script>
(function () {
  'use strict';

  var ICONOS = {
    incidencias:  '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    comunicados:  '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>',
    agenda:       '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    autorizaciones: '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    entrevistas:  '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'
  };

  /* Datos de ejemplo. Los nombres de alumnos son los del prototipo panel-incidencias.
     Todo lo que no sea incidencias es muestra inventada para el mockup. Los contadores
     de la home se calculan de estas listas, nunca se escriben a mano. */
  var FUENTES = {
    sinjust: {
      seccion: 'incidencias', titulo: 'Incidencias sin justificar', sub: 'Esperan tu decisión', estado: 'warning', pendiente: true,
      masiva: { verbo: 'Justificar', hecho: ['justificada', 'justificadas'] },
      items: [
        { id: 's1', persona: true, nombre: 'Carlos Gómez Herrera',   detalle: 'Ausencia · día completo (5 sesiones)', cuando: '02/11' },
        { id: 's2', persona: true, nombre: 'Carlos Gómez Herrera',   detalle: 'Retraso (12 min) · 1ª sesión',          cuando: '30/10' },
        { id: 's3', persona: true, nombre: 'Ana Urrutia Belmonte',   detalle: 'Ausencia · 2ª sesión',                  cuando: '02/11' },
        { id: 's4', persona: true, nombre: 'Lucía Ferreira Duarte',  detalle: 'Retraso (8 min) · 2ª sesión',           cuando: '30/10' },
        { id: 's5', persona: true, nombre: 'Mei Chen Ballester',     detalle: 'Ausencia · día completo (6 sesiones)',  cuando: '29/10' }
      ]
    },
    aceptar: {
      seccion: 'incidencias', titulo: 'Justificaciones pendientes de aceptar', sub: 'La familia ya justificó', estado: 'warning', pendiente: true,
      masiva: { verbo: 'Aceptar', hecho: ['aceptada', 'aceptadas'] },
      items: [
        { id: 'a1', persona: true, nombre: 'Ana Urrutia Belmonte',    detalle: 'Retraso (5 min) · «Ayer fuimos a urgencias.»',       cuando: '07/09' },
        { id: 'a2', persona: true, nombre: 'Youssef Amrani Ledesma',  detalle: 'Ausencia · día completo · «Gripe, adjunta justificante.»', cuando: '02/11' },
        { id: 'a3', persona: true, nombre: 'Diego Ncube Salas',       detalle: 'Ausencia · 3ª sesión · «Cita con el fisioterapeuta.»',     cuando: '30/10' }
      ]
    },
    anunc: {
      seccion: 'incidencias', titulo: 'Ausencias anunciadas por familias', sub: 'Pendientes de confirmar', estado: 'info', pendiente: true,
      masiva: { verbo: 'Confirmar', hecho: ['confirmada', 'confirmadas'] },
      items: [
        { id: 'n1', persona: true, nombre: 'Lucía Ferreira Duarte', detalle: 'Ausencia · día completo · 04/11', cuando: 'Mañana' },
        { id: 'n2', persona: true, nombre: 'Diego Ncube Salas',     detalle: 'Ausencia · día completo · 05/11', cuando: '05/11' }
      ]
    },
    riesgo: {
      seccion: 'incidencias', titulo: 'Riesgo de perder evaluación', sub: 'Faltas cerca del límite permitido', estado: 'error', pendiente: true,
      accion: 'Comunicar a la familia',
      items: [
        { id: 'r1', persona: true, nombre: 'Carlos Gómez Herrera', detalle: '18 de 20 faltas permitidas', cuando: 'Riesgo' },
        { id: 'r2', persona: true, nombre: 'Mei Chen Ballester',   detalle: '17 de 20 faltas permitidas', cuando: 'Riesgo' }
      ]
    },
    comunic: {
      seccion: 'comunicados', titulo: 'Comunicados sin contestar', sub: 'Recibidos y sin respuesta', estado: 'info', pendiente: true,
      items: [
        { id: 'c1', nombre: 'Familia de Ana Urrutia',    detalle: 'Consulta sobre la salida del jueves', cuando: 'Hace 1 día' },
        { id: 'c2', nombre: 'Familia de Youssef Amrani', detalle: 'Justificante de ausencia',            cuando: 'Hace 2 días' },
        { id: 'c3', nombre: 'Equipo directivo',          detalle: 'Convocatoria de claustro',            cuando: 'Hace 3 días' }
      ]
    },
    agenda: {
      seccion: 'agenda', titulo: 'Eventos de hoy', sub: 'En tu agenda', estado: 'info', pendiente: false,
      items: [
        { id: 'g1', nombre: 'Reunión de coordinación de ESO', detalle: 'Sala de profesores', cuando: '09:00' },
        { id: 'g2', nombre: 'Guardia de patio',               detalle: 'Patio principal',    cuando: '11:30' },
        { id: 'g3', nombre: 'Claustro',                       detalle: 'Salón de actos',     cuando: '16:00' }
      ]
    },
    autoriz: {
      seccion: 'autorizaciones', titulo: 'Autorizaciones pendientes', sub: 'Con quién falta por autorizar', estado: 'warning', pendiente: true,
      items: [
        { id: 'u1', nombre: 'Salida al museo de ciencias', detalle: 'Faltan: Ana U., Carlos G., Diego N. y 10 más', cuando: '12 de 25' },
        { id: 'u2', nombre: 'Uso de imagen · 004B',        detalle: 'Faltan: Lucía F., Mei C., Youssef A.',          cuando: '22 de 25' }
      ]
    },
    entsol: {
      seccion: 'entrevistas', titulo: 'Entrevistas solicitadas', sub: 'Esperan tu respuesta', estado: 'warning', pendiente: true,
      items: [
        { id: 'e1', nombre: 'Familia de Ana Urrutia',  detalle: 'Propone 05/11 · 17:00', cuando: 'Solicitud' },
        { id: 'e2', nombre: 'Familia de Diego Ncube',  detalle: 'Propone 06/11 · 16:30', cuando: 'Solicitud' }
      ]
    },
    enthoy: {
      seccion: 'entrevistas', titulo: 'Entrevistas de hoy', sub: 'Programadas para hoy', estado: 'info', pendiente: false,
      items: [
        { id: 'h1', nombre: 'Familia de Carlos Gómez', detalle: 'Tutoría', cuando: '16:30' },
        { id: 'h2', nombre: 'Familia de Mei Chen',     detalle: 'Tutoría', cuando: '17:15' }
      ]
    },
    entcanc: {
      seccion: 'entrevistas', titulo: 'Entrevistas canceladas por la familia', sub: 'Para que lo sepas', estado: 'error', pendiente: true,
      items: [
        { id: 'k1', nombre: 'Familia de Lucía Ferreira', detalle: 'Entrevista del 04/11 · 17:00', cuando: 'Cancelada' }
      ]
    }
  };

  var SECCIONES = [
    { titulo: 'Incidencias',    icono: 'incidencias',    claves: ['sinjust', 'aceptar', 'anunc', 'riesgo'] },
    { titulo: 'Comunicados',    icono: 'comunicados',    claves: ['comunic'] },
    { titulo: 'Agenda',         icono: 'agenda',         claves: ['agenda'] },
    { titulo: 'Autorizaciones', icono: 'autorizaciones', claves: ['autoriz'] },
    { titulo: 'Entrevistas',    icono: 'entrevistas',    claves: ['entsol', 'enthoy', 'entcanc'] }
  ];

  var ICON_CHEV_L = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="4" x2="21" y2="20"/><line x1="16" y1="12" x2="3" y2="12"/><polyline points="10 19 3 12 10 5"/></svg>';
  var ICON_CHEV_R = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><line x1="21" y1="4" x2="21" y2="20"/><line x1="16" y1="12" x2="3" y2="12"/><polyline points="10 19 3 12 10 5"/></svg>';

  var $ = function (s) { return document.querySelector(s); };
  var panel = $('#right-panel');
  var viewHome = $('#view-home');
  var viewDetail = $('#view-detail');
  var footer = $('#footer');
  var btnAccion = $('#accion-masiva');
  var claveActual = null;
  var sel = {};

  function iniciales(nombre) {
    var p = nombre.split(' ').filter(function (w) { return w.length > 2; });
    return (p[0] ? p[0][0] : '') + (p[1] ? p[1][0] : '');
  }

  function activar(el, fn) {
    el.addEventListener('click', fn);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
    });
  }

  function avatar(item, icono) {
    return '<div class="wc-avatar">' + (item.persona ? iniciales(item.nombre) : ICONOS[icono]) + '</div>';
  }

  /* ---------- Nivel 1 ---------- */
  function pintarHome() {
    viewHome.innerHTML = '';
    SECCIONES.forEach(function (s) {
      var bloque = document.createElement('div');
      bloque.className = 'bloque';
      bloque.innerHTML = '<div class="alumn-header"><span class="section-label">' + s.titulo + '</span></div>';
      s.claves.forEach(function (k) {
        var f = FUENTES[k];
        var n = f.items.length;
        var fila = document.createElement('div');
        fila.className = 'alumn-row';
        fila.tabIndex = 0;
        fila.setAttribute('role', 'button');
        fila.innerHTML =
          '<div class="wc-avatar">' + ICONOS[s.icono] + '</div>' +
          '<div class="info"><div class="info-name">' + f.titulo + '</div><div class="info-detail">' + f.sub + '</div></div>' +
          '<span class="wc-status" status="' + (n ? f.estado : 'success') + '">' + n + '</span>';
        activar(fila, function () { irADetalle(k); });
        bloque.appendChild(fila);
      });
      viewHome.appendChild(bloque);
    });
    actualizarBadge();
  }

  function actualizarBadge() {
    var total = 0;
    Object.keys(FUENTES).forEach(function (k) {
      if (FUENTES[k].pendiente) total += FUENTES[k].items.length;
    });
    $('#badge-mi-dia').textContent = total;
    $('#badge-mi-dia').style.display = total ? 'flex' : 'none';
  }

  /* ---------- Nivel 2 ---------- */
  function irADetalle(k) {
    claveActual = k;
    sel = {};
    $('#header-home').style.display = 'none';
    $('#header-detail').style.display = 'flex';
    viewHome.classList.remove('active');
    viewDetail.classList.add('active');
    pintarDetalle();
  }

  function irAHome() {
    claveActual = null;
    sel = {};
    $('#header-detail').style.display = 'none';
    $('#header-home').style.display = 'flex';
    viewDetail.classList.remove('active');
    viewHome.classList.add('active');
    footer.style.display = 'none';
    pintarHome();
  }

  function pintarDetalle(aviso) {
    var f = FUENTES[claveActual];
    var icono = f.seccion;
    $('#detail-title').textContent = f.titulo;
    $('#detail-subtitle').textContent = f.sub;
    viewDetail.innerHTML = '';

    if (aviso) {
      var a = document.createElement('div');
      a.className = 'aviso';
      a.setAttribute('role', 'status');
      a.textContent = aviso;
      viewDetail.appendChild(a);
    }

    if (!f.items.length) {
      var v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Todo al día';
      viewDetail.appendChild(v);
      footer.style.display = 'none';
      return;
    }

    if (f.masiva) {
      var t = document.createElement('label');
      t.className = 'list-row todas';
      t.innerHTML = '<input type="checkbox" class="row-check" id="sel-todas" aria-label="Seleccionar todas"> Seleccionar todas (' + f.items.length + ')';
      viewDetail.appendChild(t);
      t.querySelector('input').addEventListener('change', function (e) {
        sel = {};
        if (e.target.checked) f.items.forEach(function (i) { sel[i.id] = true; });
        viewDetail.querySelectorAll('.fila-sel').forEach(function (c) { c.checked = !!e.target.checked; });
        actualizarPie();
      });
    }

    f.items.forEach(function (item) {
      var fila = document.createElement('div');
      fila.className = 'list-row';
      fila.innerHTML =
        (f.masiva ? '<input type="checkbox" class="row-check fila-sel" aria-label="Seleccionar ' + item.nombre + ', ' + item.detalle + '">' : '') +
        avatar(item, icono) +
        '<div class="info"><div class="info-name">' + item.nombre + '</div><div class="info-detail">' + item.detalle + '</div></div>' +
        '<span class="wc-status" status="' + f.estado + '">' + item.cuando + '</span>';
      viewDetail.appendChild(fila);

      if (f.masiva) {
        fila.querySelector('.fila-sel').addEventListener('change', function (e) {
          if (e.target.checked) sel[item.id] = true; else delete sel[item.id];
          var todas = $('#sel-todas');
          todas.checked = Object.keys(sel).length === f.items.length;
          actualizarPie();
        });
      }

      if (f.accion) {
        var acciones = document.createElement('div');
        acciones.className = 'list-actions';
        acciones.innerHTML = '<button class="btn-primary btn-sm" type="button">' + f.accion + '</button>';
        acciones.querySelector('button').addEventListener('click', function () {
          pintarDetalle('Se abriría un comunicado a la familia de ' + item.nombre + ' con el contexto ya precargado.');
        });
        viewDetail.appendChild(acciones);
      }
    });

    actualizarPie();
  }

  function actualizarPie() {
    var f = FUENTES[claveActual];
    if (!f || !f.masiva || !f.items.length) { footer.style.display = 'none'; return; }
    var n = Object.keys(sel).length;
    footer.style.display = 'flex';
    btnAccion.textContent = f.masiva.verbo + (n ? ' (' + n + ')' : ' seleccionadas');
    btnAccion.disabled = n === 0;
  }

  btnAccion.addEventListener('click', function () {
    var f = FUENTES[claveActual];
    var n = Object.keys(sel).length;
    if (!n) return;
    f.items = f.items.filter(function (i) { return !sel[i.id]; });
    sel = {};
    pintarDetalle(n + (n === 1 ? ' incidencia ' + f.masiva.hecho[0] : ' incidencias ' + f.masiva.hecho[1]) + '.');
  });
  $('#cancelar').addEventListener('click', irAHome);
  $('#volver').addEventListener('click', irAHome);

  /* ---------- Panel ---------- */
  function actualizarExpandir() {
    var expandido = panel.classList.contains('expanded');
    panel.querySelectorAll('[data-expand]').forEach(function (b) {
      b.innerHTML = expandido ? ICON_CHEV_R : ICON_CHEV_L;
      b.title = expandido ? 'Reducir panel' : 'Expandir panel';
      b.setAttribute('aria-label', b.title);
    });
  }
  panel.querySelectorAll('[data-expand]').forEach(function (b) {
    b.addEventListener('click', function () {
      panel.classList.toggle('expanded');
      actualizarExpandir();
    });
  });

  function cerrar() {
    panel.classList.remove('open', 'expanded');
    $('#btn-mi-dia').classList.remove('active');
    $('#btn-mi-dia').setAttribute('aria-expanded', 'false');
    actualizarExpandir();
    irAHome();
  }
  function abrir() {
    panel.classList.add('open');
    $('#btn-mi-dia').classList.add('active');
    $('#btn-mi-dia').setAttribute('aria-expanded', 'true');
  }
  $('#btn-mi-dia').addEventListener('click', function () {
    panel.classList.contains('open') ? cerrar() : abrir();
  });
  $('#cerrar-home').addEventListener('click', cerrar);
  $('#cerrar-detail').addEventListener('click', cerrar);

  actualizarExpandir();
  pintarHome();
})();
</script>
</body>
</html>
