<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* Mi día V4. Todo con prefijo h4-. Superficies blancas, borde gris estándar de 1 px, tipografía como jerarquía; color solo en señales pequeñas.
     Tokens del design system: --color-grey-* y --radius-* (tokens-reales.css). El morado de IA (#342453) es el decidido para Acciones IA. */
  #page-home {
    --h4-ink: var(--color-grey-900); --h4-ink2: var(--color-grey-800); --h4-mut: var(--color-grey-700); --h4-mut2: var(--color-grey-600);
    --h4-line: var(--color-grey-400); --h4-bg: #f6f8fb; --h4-blue: #285a92; --h4-ai: #342453; --h4-ai-bg: #f1effa;
    font-family: 'Open Sans', system-ui, sans-serif; color: var(--h4-ink2); background: var(--h4-bg);
  }
  #page-home .h4-scroll { flex: 1; overflow-y: auto; }
  #page-home p { font-family: 'Open Sans', system-ui, sans-serif; font-weight: 400; }
  #page-home .h4-wrap { max-width: 1080px; margin: 0 auto; padding: 44px 32px 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px; }
  #page-home [hidden] { display: none !important; }
  #page-home .h4-card { background: #fff; border: 1px solid var(--h4-line); border-radius: var(--radius-lg); }
  #page-home .h4-card-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px 8px; flex-wrap: wrap; }
  #page-home .h4-card-h.h4-flat { padding: 0 0 14px; }
  #page-home .h4-card-t { margin: 0; font-size: 14px; font-weight: 700; color: var(--h4-ink2); }
  #page-home .h4-card-s { margin: 8px 0 0; font-size: 12.5px; color: var(--h4-mut); }
  #page-home .h4-link { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; font: 600 13px 'Open Sans', sans-serif; color: var(--h4-blue); cursor: pointer; }
  #page-home .h4-link:hover { text-decoration: underline; }
  #page-home .h4-lk { border: 0; background: none; padding: 0 0 0 4px; font: 600 13px 'Open Sans', sans-serif; color: var(--h4-blue); cursor: pointer; }
  #page-home .h4-lk:hover { text-decoration: underline; }
  #page-home button:focus-visible, #page-home [role="button"]:focus-visible { outline: 2px solid var(--h4-blue); outline-offset: 2px; }

  /* entrada escalonada */
  #page-home .h4-rv { opacity: 0; transform: translateY(14px); }
  #page-home .h4-rv.in { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2, .8, .2, 1); }

  /* cabecera */
  #page-home .h4-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  #page-home .h4-date { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--h4-mut2); }
  #page-home .h4-h1 { margin: 8px 0 12px; font-family: 'Nunito', sans-serif; font-weight: 200; font-size: 46px; line-height: 1.1; color: var(--h4-ink); }
  #page-home .h4-brief { margin: 0; max-width: 660px; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.55; color: var(--h4-ink2); }
  #page-home .h4-brief b { color: var(--h4-ink); font-weight: 600; }
  #page-home .h4-ai-tag { flex: none; display: inline-flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--h4-ai); background: var(--h4-ai-bg); border-radius: 30px; padding: 2px 10px; white-space: nowrap; }
  #page-home .h4-src { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #page-home .h4-chip { border: 1px solid var(--h4-line); background: #fff; border-radius: 30px; padding: 4px 12px; font: 400 12px 'Open Sans', sans-serif; color: var(--h4-ink2); cursor: pointer; transition: border-color .15s, color .15s; }
  #page-home .h4-chip:hover { border-color: var(--h4-blue); color: var(--h4-blue); }
  #page-home .h4-src .h4-chip { color: var(--h4-ai); border-color: #cbc3e6; background: var(--h4-ai-bg); font-weight: 600; }
  #page-home .h4-src .h4-chip:hover { background: #e7e2f7; border-color: var(--h4-ai); color: var(--h4-ai); }

  /* Ahora */
  #page-home .h4-now { position: relative; overflow: hidden; display: block; padding: 0; }
  #page-home .h4-now-a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start; padding: 28px 32px 24px; }
  #page-home .h4-now-b { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: nowrap; padding: 16px 32px; border-top: 1px solid #e1e4e8; }
  #page-home .h4-now-b .h4-flags { flex: 1; min-width: 0; }
  #page-home .h4-now-b .h4-ia { flex: none; width: auto; display: inline-block; }
  /* barra lateral en el color del área (Matemáticas), como las tarjetas de la agenda */
  #page-home .h4-now::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #7cc0a8; transform-origin: top; transform: scaleY(0); }
  #page-home .h4-now.in::before { transform: scaleY(1); transition: transform 1s cubic-bezier(.2, .8, .2, 1) .2s; }
  #page-home .h4-now-eb { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--h4-mut); }
  #page-home .h4-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--h4-blue); border: 1px solid #b9cfe6; border-radius: 30px; padding: 2px 11px; }
  #page-home .h4-pill i { width: 7px; height: 7px; border-radius: 50%; background: #10855b; animation: h4pulse 2.2s ease-out infinite; }
  #page-home .h4-now-l { cursor: pointer; }
  #page-home .h4-now-l:hover .h4-now-t { color: var(--h4-blue); }
  #page-home .h4-now-t { transition: color .15s; }
  #page-home .h4-now-t { margin: 12px 0 4px; font-family: 'Nunito', sans-serif; font-weight: 300; font-size: 30px; line-height: 1.15; color: var(--h4-ink); }
  #page-home .h4-now-m { margin: 0; font-size: 13px; color: var(--h4-mut); }
  #page-home .h4-flags { display: flex; gap: 8px; flex-wrap: wrap; }
  #page-home .h4-flag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; border: 1px solid var(--h4-line); border-radius: 30px; padding: 3px 12px; color: var(--h4-ink2); background: #fff; }
  #page-home .h4-flag.warn { border-color: #ecd5a4; color: #8a5a00; }
  #page-home .h4-flag.ok { border-color: #a9d9c4; color: #0e7550; }
  #page-home .h4-now-r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  #page-home .h4-2col { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px; align-items: stretch; }

  /* línea de tiempo */
  #page-home .h4-tl { margin-top: 0; padding: 12px 24px 22px; border-top: 1px solid #e1e4e8; }
  #page-home .h4-ev { display: grid; grid-template-columns: 46px 14px minmax(0, 1fr); gap: 14px; padding: 11px 8px; margin: 0 -8px; border-radius: var(--radius-md); cursor: pointer; transition: background .15s; }
  #page-home .h4-ev:hover { background: #f8fafd; }
  #page-home .h4-ev-h { font-size: 13px; font-weight: 600; color: var(--h4-blue); text-align: right; padding-top: 1px; }
  #page-home .h4-ev-h i { display: block; font-style: normal; font-weight: 400; font-size: 11px; color: var(--h4-mut2); }
  #page-home .h4-ev-d { position: relative; display: flex; justify-content: center; }
  #page-home .h4-ev-d::before { content: ""; position: absolute; top: 16px; bottom: -26px; width: 1px; background: var(--h4-line); transform-origin: top; }
  #page-home .h4-rv:not(.in) .h4-ev-d::before { transform: scaleY(0); }
  #page-home .h4-rv.in .h4-ev-d::before { transform: scaleY(1); transition: transform .8s ease var(--d, 0ms); }
  #page-home .h4-ev:last-child .h4-ev-d::before { display: none; }
  #page-home .h4-ev-d b { position: relative; z-index: 1; width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; border: 2px solid var(--c); background: #fff; box-sizing: content-box; }
  #page-home .h4-ev.now .h4-ev-d b { background: var(--c); animation: h4pulse 2.2s ease-out infinite; }
  #page-home .h4-ev-x { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #page-home .h4-ev-t { font-size: 14px; font-weight: 600; color: var(--h4-ink); }
  #page-home .h4-ev-t em { font-style: normal; font-size: 11px; font-weight: 700; color: #0e7550; margin-left: 8px; }
  #page-home .h4-ev-s { font-size: 12.5px; color: var(--h4-mut); line-height: 1.4; }

  /* pide respuesta */
  #page-home .h4-ask { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 24px; border-top: 1px solid var(--h4-line); cursor: pointer; transition: background .15s; }
  #page-home .h4-ask:first-of-type { margin-top: 8px; }
  #page-home .h4-ask:hover { background: #f8fafd; }
  #page-home .h4-ask-x { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #page-home .h4-ask-t { font-size: 14px; font-weight: 600; color: var(--h4-ink); }
  #page-home .h4-ask-s { font-size: 12.5px; color: var(--h4-mut); }
  #page-home .h4-ask-n { display: inline-flex; align-items: center; gap: 8px; color: var(--h4-mut2); }
  #page-home .h4-ask-n b { font-family: 'Nunito', sans-serif; font-weight: 300; font-size: 28px; line-height: 1; color: var(--h4-ink); }
  #page-home .h4-ask.done { opacity: .5; }
  #page-home .h4-ask:hover .h4-ask-n svg { transform: translateX(2px); }
  #page-home .h4-ask-n svg { transition: transform .15s; }

  /* tutoría */
  #page-home .h4-sec { display: flex; flex-direction: column; gap: 18px; }
  #page-home .h4-sh { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 0 0 18px; border-bottom: 1px solid #bfe3df; }
  #page-home .h4-sh-ic { flex: none; width: 48px; height: 48px; border-radius: 12px; background: #e3f4f2; color: #1b7f79; display: flex; align-items: center; justify-content: center; }
  #page-home .h4-sh-eb { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #1b7f79; }
  #page-home .h4-sh-h { margin: 8px 0 0; font-family: 'Nunito', sans-serif; font-weight: 300; font-size: 32px; line-height: 1.15; color: var(--h4-ink); }
  #page-home .h4-sh-r { margin-left: auto; }
  #page-home .h4-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #page-home .h4-st { display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-left: 1px solid var(--h4-line); min-width: 0; }
  #page-home .h4-st:first-child { border-left: 0; }
  #page-home .h4-st-l { font-size: 14px; font-weight: 700; color: var(--h4-ink2); }
  #page-home .h4-st-v { font-family: 'Nunito', sans-serif; font-weight: 300; font-size: 38px; line-height: 1.1; color: var(--h4-ink); }
  #page-home .h4-st-v b { font-weight: 300; }
  #page-home .h4-st-v small { font: 400 13px 'Open Sans', sans-serif; color: var(--h4-mut); }
  #page-home .h4-st-n { font-size: 12px; color: var(--h4-mut); }
  #page-home .h4-spark { display: flex; align-items: flex-end; gap: 8px; height: 58px; margin-top: auto; padding-top: 8px; }
  #page-home .h4-spark span { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%; }
  #page-home .h4-spark i { display: block; width: 100%; border-radius: 4px; background: var(--b); transition: height .8s cubic-bezier(.2, .9, .3, 1.15); }
  #page-home .h4-spark em { font-style: normal; font-size: 10px; color: var(--h4-mut2); }
  #page-home .h4-split { display: flex; gap: 3px; height: 6px; margin-top: auto; border-radius: 30px; overflow: hidden; }
  #page-home .h4-split i { display: block; height: 100%; border-radius: 30px; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  #page-home .h4-dots { display: flex; gap: 8px; margin-top: auto; }
  #page-home .h4-dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #cdd8e6; }
  #page-home .h4-dots i.r { background: #0a529f; border-color: #0a529f; }

  /* alumnos */
  #page-home .h4-stu-h { padding-bottom: 14px; }
  #page-home .h4-stu { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 16px 24px; border-top: 1px solid var(--h4-line); transition: background .15s, opacity .3s; }
  #page-home .h4-stu.click { cursor: pointer; }
  #page-home .h4-stu.click:hover { background: #fafbfd; }
  #page-home .h4-stu-av { width: 40px; height: 40px; border-radius: 50%; display: block; }
  #page-home .h4-stu-n { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; font-weight: 700; color: var(--h4-ink); }
  #page-home .h4-tag { font-size: 11px; font-weight: 700; border: 1px solid var(--c); color: var(--ct); background: #fff; border-radius: 30px; padding: 0 9px; }
  #page-home .h4-stu-r { margin: 8px 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: var(--h4-mut); }
  #page-home .h4-ai-mini { flex: none; display: inline-flex; margin-top: 4px; color: var(--h4-ai); opacity: .8; }
  #page-home .h4-sg { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--h4-mut); }
  #page-home .h4-sg i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #b4bfcb; box-sizing: border-box; }
  #page-home .h4-sg.ok i { background: #10855b; border-color: #10855b; }
  #page-home .h4-sg.wr i { background: #2a80b5; border-color: #2a80b5; }
  #page-home .h4-sg.wn i { background: #d9822b; border-color: #d9822b; }
  #page-home .h4-stu-a { display: flex; align-items: center; gap: 8px; }
  #page-home .h4-stu.hecho { opacity: .55; }
  #page-home .h4-done { font-size: 12px; color: #0e7550; font-weight: 600; }
  #page-home .h4-hechos-h { padding: 14px 24px 6px; border-top: 1px solid var(--h4-line); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--h4-mut2); }
  #page-home .h4-vacio { padding: 26px 24px; text-align: center; font-size: 13px; color: var(--h4-mut2); border-top: 1px solid var(--h4-line); }

  /* mis clases */
  #page-home .h4-cls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  #page-home .h4-cl { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px 16px; transition: box-shadow .2s, transform .2s; }
  #page-home .h4-cl:hover { box-shadow: 0 6px 22px rgba(16, 40, 70, .07); transform: translateY(-2px); }
  #page-home .h4-cl-s { margin: -4px 0 4px; font-size: 12.5px; color: var(--h4-mut); }
  #page-home .h4-cl-r { display: flex; justify-content: space-between; font-size: 13px; color: var(--h4-ink2); }
  #page-home .h4-cl-r b { font-weight: 700; color: var(--h4-ink); }
  #page-home .h4-prog { height: 5px; border-radius: 30px; background: #e9eef5; overflow: hidden; }
  #page-home .h4-prog i { display: block; height: 100%; width: 0; border-radius: 30px; background: var(--h4-blue); transition: width 1s cubic-bezier(.2, .8, .2, 1); }
  #page-home .h4-cl .h4-link { align-self: flex-start; margin-top: 8px; }

  /* panel de IA */
  .h4-acts { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .h4-act { border: 1px solid #e8e9eb; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .h4-act b { font-size: 14px; color: #333; }
  .h4-act p { margin: 0; font-size: 13px; line-height: 1.5; color: #5c5c5c; }
  .h4-act .h4-tag { font-size: 11px; font-weight: 700; border: 1px solid var(--c); color: var(--ct); background: #fff; border-radius: 30px; padding: 0 9px; }

  /* toast */
  .h4-toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 16px; background: #1f2937; color: #fff; font: 400 13px 'Open Sans', sans-serif; padding: 11px 18px; border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .22); transition: opacity .25s, transform .25s; }
  .h4-toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .h4-toast-u { border: 0; background: none; color: #9cc3e0; font: 700 13px 'Open Sans', sans-serif; cursor: pointer; padding: 0; }

  @keyframes h4pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 133, 91, .45); } 70% { box-shadow: 0 0 0 8px rgba(16, 133, 91, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 133, 91, 0); } }
  @media (max-width: 900px) {
    #page-home .h4-wrap { padding: 28px 16px 80px; gap: 28px; }
    #page-home .h4-h1 { font-size: 36px; }
    #page-home .h4-now-a { grid-template-columns: 1fr; padding: 24px 20px; }
    #page-home .h4-now-b { padding: 16px 20px; flex-wrap: wrap; }
    #page-home .h4-now-r { align-items: flex-start; }
    #page-home .h4-2col { grid-template-columns: 1fr; }
    #page-home .h4-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #page-home .h4-st:nth-child(3) { border-left: 0; }
    #page-home .h4-st:nth-child(n+3) { border-top: 1px solid var(--h4-line); }
    #page-home .h4-stu { grid-template-columns: 40px minmax(0, 1fr); }
    #page-home .h4-stu-a { grid-column: 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    #page-home .h4-rv, #page-home .h4-rv.in { opacity: 1; transform: none; transition: none; }
    #page-home *, .h4-toast { animation: none !important; transition: none !important; }
  }

  /* Reglas genéricas que usan los paneles (tarjetas de motivo, botonera) */

</style>

<style>
  /* Solo lo que no tiene Web Component: tarjetas de motivo con icono. */
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 96px; padding: 12px 8px; background: #fff; border: 1px solid #DFE1E6; border-radius: 8px; cursor: pointer; font: 700 12px Nunito, sans-serif; color: #333; text-align: center; line-height: 1.25; }
  .tile:hover { border-color: #285A92; }
  .tile-ic { width: 40px; height: 40px; border-radius: 50%; background: #E8F2F8; display: flex; align-items: center; justify-content: center; }
  .tile svg { width: 22px; height: 22px; stroke: #285A92; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tile[aria-checked="true"] { border: 2px solid #285A92; background: #E8F2F8; padding: 11px 7px; }
  .tile[aria-checked="true"] .tile-ic { background: #285A92; }
  .tile[aria-checked="true"] svg { stroke: #fff; }
  .tile:focus-visible { outline: 2px solid #285A92; outline-offset: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .pad { padding: 14px; }
  #page-home .hm-tut-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  #page-home .hm-tut-top > * { margin: 0; }
  /* Cabecera de la sección Mi tutoría: icono, rótulo, título del grupo y acciones a la derecha, con filete lila */
  #page-home .hm-th { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 4px 0 16px; margin-bottom: 16px; border-bottom: 1px solid #bfe3df; }
  #page-home .hm-th-ic { flex: none; width: 48px; height: 48px; border-radius: 12px; background: #e3f4f2; color: #1b7f79; display: flex; align-items: center; justify-content: center; }
  #page-home .hm-th-t { min-width: 0; }
  #page-home .hm-th-eb { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #1b7f79; }
  #page-home .hm-th-h { margin: 2px 0 0; font-family: 'Nunito', sans-serif; font-weight: 300; font-size: 32px; line-height: 1.15; color: var(--color-black); }
  #page-home .hm-th-r { margin-left: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #page-home .hm-chips { gap: 12px; }
  #page-home .hm-grupo-w { margin-left: auto; min-width: 220px; }
  #page-home .hm-kpis { margin-bottom: 16px; }
  #page-home .hm-kl { font-size: 14px; font-weight: 700; color: var(--color-grey-800); }
  body.con-botonera-webpart .body-row { padding-right: 60px; }
  content-section > * { grid-column: 1 / -1; }
  #page-home .hm-cols { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
</style>
</head>
