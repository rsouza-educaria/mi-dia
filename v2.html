<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Solo lo que el kit no trae. Tokens con nombre real, sin hex sueltos. */

  /* Faja de versiones */
  .versiones {
    height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: var(--rf-bg-normal); border-bottom: 1px solid var(--rf-color-border-light);
    font-family: var(--font-family-ui); font-size: var(--font-size-100);
  }
  .versiones span { color: var(--rf-color-text-sec); margin-right: 8px; }
  .versiones a {
    padding: 4px 10px; border-radius: var(--radius-sm); text-decoration: none;
    color: var(--rf-color-text-sec); font-weight: var(--font-weight-bold);
  }
  .versiones a:hover { background: var(--color-grey-300); }
  .versiones a[aria-current="page"] { background: var(--color-blue-50); color: var(--color-blue-500); }

  .shell { flex: 1; display: flex; overflow: hidden; background: var(--color-grey-300); }
  .ref-main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 24px; text-align: center;
    color: var(--rf-color-text-sec); font-family: var(--font-family-reading); font-size: var(--font-size-200);
  }
  .ref-main strong { font-family: var(--font-family-ui); font-size: var(--font-size-300); color: var(--rf-color-text); }

  /* El panel se abre a la izquierda de la barra, para que su icono siga visible */
  .right-panel { top: 32px; right: 48px; }

  /* Barra de iconos: solo referencia visual del shell. El único item real es Mi día (el último). */
  .wp-btn.ref { background: var(--color-grey-300); cursor: default; }
  .wp-btn.ref svg { stroke: var(--color-grey-600); }
  .wp-btn.mi-dia { background: var(--color-blue-50); }
  .wp-btn.mi-dia svg { stroke: var(--color-blue-500); }
  .ph-icon.azul { background: var(--color-blue-50); }
  .ph-icon.azul svg { stroke: var(--color-blue-500); fill: none; stroke-width: 2; }
  .ph-bar.azul { background: var(--color-blue-500); }

  /* Colores por apartado */
  .c-incidencias   { --tile-bg: var(--color-yellow-100); --tile-fg: var(--color-yellow-900); }
  .c-comunicados   { --tile-bg: var(--color-blue-100);   --tile-fg: var(--color-blue-600); }
  .c-agenda        { --tile-bg: var(--color-cyan-100);   --tile-fg: var(--color-cyan-800); }
  .c-autorizaciones{ --tile-bg: var(--color-green-100);  --tile-fg: var(--color-green-800); }
  .c-entrevistas   { --tile-bg: var(--color-purple-100); --tile-fg: var(--color-purple-800); }

  /* Nivel 1: resumen + cuadrados */
  .resumen { padding: 20px 16px 4px; }
  .resumen-num { font-family: var(--font-family-display); font-size: var(--font-size-display); font-weight: var(--font-weight-display); line-height: var(--line-height-display); letter-spacing: var(--letter-spacing-display); color: var(--rf-color-text); }
  .resumen-txt { font-family: var(--font-family-reading); font-size: var(--font-size-200); line-height: var(--line-height-200); color: var(--rf-color-text-sec); }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 16px; }
  .tile {
    aspect-ratio: 1 / 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px; border-radius: var(--radius-lg); cursor: pointer;
    background: var(--rf-bg-white); border: 1px solid var(--rf-color-border-light);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .tile:hover { border-color: var(--tile-fg); box-shadow: 0 2px 10px var(--alert-divider); }
  .tile-icono {
    width: 44px; height: 44px; border-radius: var(--radius-md); flex-shrink: 0;
    background: var(--tile-bg); color: var(--tile-fg); display: flex; align-items: center; justify-content: center;
  }
  .tile-icono svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
  .tile-num { font-family: var(--font-family-display); font-size: var(--font-size-600); font-weight: var(--font-weight-extrabold); line-height: var(--line-height-600); color: var(--rf-color-text); }
  .tile-titulo { font-family: var(--font-family-ui); font-size: var(--font-size-200); font-weight: var(--font-weight-bold); line-height: var(--line-height-200); color: var(--rf-color-text); }
  .tile-sub {
    font-family: var(--font-family-reading); font-size: var(--font-size-100); line-height: var(--line-height-100); color: var(--rf-color-text-sec);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tile.al-dia .tile-num { color: var(--rf-color-text-sec); }

  /* Nivel 2 */
  /* Pestañas en partes iguales: número arriba, rótulo debajo. Sin scroll horizontal. */
  .tabs-mi-dia { padding: 0 8px; overflow: hidden; }
  .tabs-mi-dia .eng-tab {
    flex: 1 1 0; min-width: 0; flex-direction: column; justify-content: center; text-align: center;
    gap: 2px; padding: 10px 2px 10px;
  }
  .tab-num {
    font-family: var(--font-family-display); font-size: var(--font-size-400); font-weight: var(--font-weight-extrabold);
    line-height: var(--line-height-400); color: var(--rf-color-text);
  }
  .tab-num.warn   { color: var(--alert-text-warning); }
  .tab-num.danger { color: var(--alert-text-error); }
  .tab-num.info   { color: var(--alert-text-info); }
  .tab-num.ok     { color: var(--alert-text-success); }
  .tab-txt { font-size: var(--font-size-100); font-weight: var(--font-weight-semibold); line-height: var(--line-height-100); white-space: nowrap; }
  .wc-avatar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  .list-row .row-check { flex-shrink: 0; }
  .todas { background: var(--rf-bg-normal); cursor: pointer; font-family: var(--font-family-ui); font-size: var(--font-size-200); font-weight: var(--font-weight-semibold); color: var(--rf-color-text); }
  .aviso {
    margin: 12px 16px; padding: 10px 12px; border-radius: var(--radius-md);
    background: var(--alert-bg-success); border: 1px solid var(--alert-border-success); color: var(--alert-text-success);
    font-family: var(--font-family-reading); font-size: var(--font-size-200); line-height: var(--line-height-200);
  }
  .vacio { padding: 32px 16px; text-align: center; color: var(--rf-color-text-sec); font-family: var(--font-family-reading); font-size: var(--font-size-200); }

  /* El kit pinta el texto de warning/error con tonos que no llegan a AA sobre su fondo: se usan los de alerta. */
  .wc-status[status="warning"] { color: var(--alert-text-warning); }
  .wc-status[status="error"]   { color: var(--alert-text-error); }

  /* Foco visible */
  .versiones a:focus-visible, .tile:focus-visible, .eng-tab:focus-visible,
  .list-row:focus-visible, .wp-btn:focus-visible, .ph-btn:focus-visible,
  .com-toggle-btn:focus-visible, .btn-primary:focus-visible, .btn-secondary:focus-visible {
    outline: 2px solid var(--rf-color-primary); outline-offset: -2px;
  }
</style>
</head>

    });
    $('#badge-mi-dia').textContent = pendientes;
    $('#badge-mi-dia').style.display = pendientes ? 'flex' : 'none';

    viewHome.innerHTML =
      '<div class="resumen">' +
        '<div class="resumen-num">' + (pendientes ? pendientes + ' pendientes' : 'Todo al día') + '</div>' +
        '<div class="resumen-txt">' + (pendientes ? 'Es lo que necesita tu atención hoy.' : 'No tienes nada pendiente hoy.') + '</div>' +
      '</div>';
    var rej = document.createElement('div');
    rej.className = 'rejilla';

    APARTADOS.forEach(function (ap) {
      var n = total(ap);
      var partes = ap.claves.filter(function (k) { return FUENTES[k].items.length; })
        .map(function (k) { return FUENTES[k].items.length + ' ' + FUENTES[k].corto; });
      var sub = partes.length ? partes.join(' · ') : 'Todo al día';
      var t = document.createElement('div');
      t.className = 'tile c-' + ap.id + (n ? '' : ' al-dia');
      t.tabIndex = 0;
      t.setAttribute('role', 'button');
      t.setAttribute('aria-label', ap.titulo + ': ' + sub);
      t.title = sub;
      t.innerHTML =
        '<div class="tile-icono">' + ICONOS[ap.id] + '</div>' +
        '<div>' +
          '<div class="tile-num">' + n + '</div>' +
          '<div class="tile-titulo">' + ap.titulo + '</div>' +
          '<div class="tile-sub">' + sub + '</div>' +
        '</div>';
      activar(t, function () { irADetalle(ap.id); });
      rej.appendChild(t);
    });
    viewHome.appendChild(rej);
  }

  /* ---------- Nivel 2 ---------- */
  function apartado(id) {
    return APARTADOS.filter(function (a) { return a.id === id; })[0];
  }

  function irADetalle(id) {
    apartadoActual = apartado(id);
    claveActual = apartadoActual.claves[0];
    sel = {};
    $('#header-home').style.display = 'none';
    $('#header-detail').style.display = 'flex';
    viewHome.classList.remove('active');
    viewDetail.classList.add('active');
    pintarDetalle();
  }

  function irAHome() {
    apartadoActual = null;
    claveActual = null;
    sel = {};
    $('#header-detail').style.display = 'none';
    $('#header-home').style.display = 'flex';
    viewDetail.classList.remove('active');
    viewHome.classList.add('active');
    footer.style.display = 'none';
    pintarHome();
  }

  function cambiarPestana(k) {
    claveActual = k;
    sel = {};
    pintarDetalle();
  }

  function pintarDetalle(aviso) {
    var f = FUENTES[claveActual];
    $('#detail-title').textContent = apartadoActual.titulo;
    $('#detail-subtitle').textContent = f.sub;
    viewDetail.innerHTML = '';

    if (apartadoActual.claves.length > 1) {
      var tabs = document.createElement('div');
      tabs.className = 'eng-tabs tabs-mi-dia';
      tabs.setAttribute('role', 'tablist');
      apartadoActual.claves.forEach(function (k) {
        var fk = FUENTES[k];
        var n = fk.items.length;
        var tab = document.createElement('div');
        tab.className = 'eng-tab' + (k === claveActual ? ' active' : '');
        tab.tabIndex = 0;
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', k === claveActual ? 'true' : 'false');
        tab.innerHTML = '<span class="tab-num ' + BADGE[n ? fk.estado : 'success'] + '">' + n + '</span><span class="tab-txt">' + fk.tab + '</span>';
        activar(tab, function () { cambiarPestana(k); });
        tabs.appendChild(tab);
      });
      viewDetail.appendChild(tabs);
    }

    if (aviso) {
      var a = document.createElement('div');
      a.className = 'aviso';
      a.setAttribute('role', 'status');
      a.textContent = aviso;
      viewDetail.appendChild(a);
    }

    if (!f.items.length) {
      var v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Todo al día';
      viewDetail.appendChild(v);
      footer.style.display = 'none';
      return;
    }

    if (f.masiva) {
      var t = document.createElement('label');
      t.className = 'list-row todas';
      t.innerHTML = '<input type="checkbox" class="row-check" id="sel-todas" aria-label="Seleccionar todas"> Seleccionar todas (' + f.items.length + ')';
      viewDetail.appendChild(t);
      t.querySelector('input').addEventListener('change', function (e) {
        sel = {};
        if (e.target.checked) f.items.forEach(function (i) { sel[i.id] = true; });
        viewDetail.querySelectorAll('.fila-sel').forEach(function (c) { c.checked = !!e.target.checked; });
        actualizarPie();
      });
    }

    f.items.forEach(function (item) {
      var fila = document.createElement('div');
      fila.className = 'list-row';
      fila.innerHTML =
        (f.masiva ? '<input type="checkbox" class="row-check fila-sel" aria-label="Seleccionar ' + item.nombre + ', ' + item.detalle + '">' : '') +
        '<div class="wc-avatar">' + (item.persona ? iniciales(item.nombre) : ICONOS[apartadoActual.id]) + '</div>' +
        '<div class="info"><div class="info-name">' + item.nombre + '</div><div class="info-detail">' + item.detalle + '</div></div>' +
        '<span class="wc-status" status="' + f.estado + '">' + item.cuando + '</span>';
      viewDetail.appendChild(fila);

      if (f.masiva) {
        fila.querySelector('.fila-sel').addEventListener('change', function (e) {
          if (e.target.checked) sel[item.id] = true; else delete sel[item.id];
          $('#sel-todas').checked = Object.keys(sel).length === f.items.length;
          actualizarPie();
        });
      }

      if (f.accion) {
        var acciones = document.createElement('div');
        acciones.className = 'list-actions';
        acciones.innerHTML = '<button class="btn-primary btn-sm" type="button">' + f.accion + '</button>';
        acciones.querySelector('button').addEventListener('click', function () {
          pintarDetalle('Se abriría un comunicado a la familia de ' + item.nombre + ' con el contexto ya precargado.');
        });
        viewDetail.appendChild(acciones);
      }
    });

    actualizarPie();
  }

  function actualizarPie() {
    var f = FUENTES[claveActual];
    if (!f || !f.masiva || !f.items.length) { footer.style.display = 'none'; return; }
    var n = Object.keys(sel).length;
    footer.style.display = 'flex';
    btnAccion.textContent = f.masiva.verbo + (n ? ' (' + n + ')' : ' seleccionadas');
    btnAccion.disabled = n === 0;
  }

  btnAccion.addEventListener('click', function () {
    var f = FUENTES[claveActual];
    var n = Object.keys(sel).length;
    if (!n) return;
    f.items = f.items.filter(function (i) { return !sel[i.id]; });
    sel = {};
    pintarDetalle(n + (n === 1 ? ' incidencia ' + f.masiva.hecho[0] : ' incidencias ' + f.masiva.hecho[1]) + '.');
  });
  $('#cancelar').addEventListener('click', irAHome);
  $('#volver').addEventListener('click', irAHome);

  /* ---------- Panel ---------- */
  function actualizarExpandir() {
    var expandido = panel.classList.contains('expanded');
    panel.querySelectorAll('[data-expand]').forEach(function (b) {
      b.innerHTML = expandido ? ICON_CHEV_R : ICON_CHEV_L;
      b.title = expandido ? 'Reducir panel' : 'Expandir panel';
      b.setAttribute('aria-label', b.title);
    });
  }
  panel.querySelectorAll('[data-expand]').forEach(function (b) {
    b.addEventListener('click', function () {
      panel.classList.toggle('expanded');
      actualizarExpandir();
    });
  });

  function cerrar() {
    panel.classList.remove('open', 'expanded');
    $('#btn-mi-dia').classList.remove('active');
    $('#btn-mi-dia').setAttribute('aria-expanded', 'false');
    actualizarExpandir();
    irAHome();
  }
  function abrir() {
    panel.classList.add('open');
    $('#btn-mi-dia').classList.add('active');
    $('#btn-mi-dia').setAttribute('aria-expanded', 'true');
  }
  $('#btn-mi-dia').addEventListener('click', function () {
    panel.classList.contains('open') ? cerrar() : abrir();
  });
  $('#cerrar-home').addEventListener('click', cerrar);
  $('#cerrar-detail').addEventListener('click', cerrar);

  actualizarExpandir();
  pintarHome();
})();
</script>
</body>
</html>
